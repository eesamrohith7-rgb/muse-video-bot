[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-construction-reel"
version = "0.1.0"
description = "Local construction footage scanning and reel production pipeline"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
construction-reel = "muse_reel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

